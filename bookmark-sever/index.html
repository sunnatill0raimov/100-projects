<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bookmark Sever</title>
	<!-- Style link -->
	<link rel="stylesheet" href="style.css">
	<!-- Script -->
	<script src="script.js" defer></script>
</head>
<body>
	<div class="container">
		<h1>Bookmark Saver</h1>

		<form id="bookmarkForm">
			<input type="text" name="name" placeholder="Bookmark Name">
			<input type="text" name="url" placeholder="Bookmark URL">
			<button type="submit">Add Bookmark</button>
		</form>

		<!-- bookmark container -->
		 <div class="bookmark-container" id="bookmark-container"></div>

	</div>
</body>
</html>
